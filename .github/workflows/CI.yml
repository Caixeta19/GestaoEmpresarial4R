name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: syscor_test
          POSTGRES_USER: syscor
          POSTGRES_PASSWORD: syscor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Rodar testes
        run: mvn -B clean verify
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/syscor_test
          SPRING_DATASOURCE_USERNAME: syscor
          SPRING_DATASOURCE_PASSWORD: syscor

      - name: Publicar relatorio de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Build do artefato
        run: mvn -B package -DskipTests

      - name: Publicar jar
        uses: actions/upload-artifact@v4
        with:
          name: syscor-jar
          path: target/*.jar
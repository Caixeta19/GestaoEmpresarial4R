spring:
  application:
    name: syscor

  profiles:
    default: dev

  docker:
    compose:
      enabled: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema é sempre gerido pelo Flyway, nunca pelo Hibernate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo
        globally_quoted_identifiers: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  jwt:
    expiration: 60m
  whatsapp:
    api-base-url: https://graph.facebook.com/v20.0
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    waba-id: ${WHATSAPP_WABA_ID:}
    rate-limit-ms: 1000

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
spring:
  application:
    name: syscor

  profiles:
    default: dev

  docker:
    compose:
      enabled: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema é sempre gerido pelo Flyway, nunca pelo Hibernate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Sao_Paulo
        globally_quoted_identifiers: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  jwt:
    expiration: 60m
  whatsapp:
    api-base-url: https://graph.facebook.com/v20.0
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    waba-id: ${WHATSAPP_WABA_ID:}
    rate-limit-ms: 1000

server:
  port: 8080
  forward-headers-strategy: native
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Segredos SEMPRE por variável de ambiente / cofre, nunca no repositório.
syscor:
  revenda:
    # "Revenda: <nome>" no relatório de Gestão Documental.
    nome: ${SYSCOR_REVENDA_NOME:4 REDES}
  jwt:
    secret: ${SYSCOR_JWT_SECRET}
  precos:
    # Regra 6 da tabela da Telefônica: o PVP do aparelho NÃO inclui o chip, que tem preço fixo.
    chip: ${SYSCOR_PRECO_CHIP:13.00}
  ia:
    # Diagnóstico do inventário pela API do Claude. Sem chave, o inventário funciona e o diagnóstico fica indisponível.
    api-key: ${ANTHROPIC_API_KEY:}
    modelo: ${SYSCOR_IA_MODELO:claude-opus-5-5}
    timeout: ${SYSCOR_IA_TIMEOUT:120s}
    max-tokens: ${SYSCOR_IA_MAX_TOKENS:16000}
    # Itens por chamada (no máximo 100).
    lote: ${SYSCOR_IA_LOTE:100}
  carrinho:
    # Venda ABERTA sem atividade há mais que isso é cancelada e libera o estoque reservado.
    expiracao: ${SYSCOR_CARRINHO_EXPIRACAO:24h}
    # Intervalo entre verificações do job de expiração.
    verificacao-ms: ${SYSCOR_CARRINHO_VERIFICACAO_MS:300000}
  webhooks:
    tolerancia-segundos: 300
    reprocesso-ms: 60000
    banco-proprio:
      secret: ${BANCO_PROPRIO_WEBHOOK_SECRET:}
    banco-brasil:
      secret: ${BB_WEBHOOK_SECRET:}
      ips-permitidos: ${BB_WEBHOOK_IPS:}
  caixa:
    # Quem pode o quê no caixa (docs/financeiro_caixa.md). Listas separadas por vírgula; o cargo é comparado sem acento.
    # Gerente: abre e fecha só o caixa da própria filial.
    cargos-gerente: ${SYSCOR_CAIXA_CARGOS_GERENTE:GERENTE DE VENDAS - JUNIOR,GERENTE DE VENDAS - PLENO,GERENTE DE VENDAS - SENIOR}
    # Auditoria de caixa: abre e fecha em qualquer filial, confere e reabre.
    cargos-auditoria: ${SYSCOR_CAIXA_CARGOS_AUDITORIA:}
    # Financeiro: confere e reabre.
    cargos-financeiro: ${SYSCOR_CAIXA_CARGOS_FINANCEIRO:}
    # Logins com todos os poderes sobre o caixa (em produção, por variável de ambiente).
    admins: ${SYSCOR_CAIXA_ADMINS:}
    # true: caixa de dia anterior ainda aberto impede vender hoje; false: só avisa.
    bloquear-com-caixa-anterior-aberto: ${SYSCOR_CAIXA_BLOQUEAR_ANTERIOR_ABERTO:false}
